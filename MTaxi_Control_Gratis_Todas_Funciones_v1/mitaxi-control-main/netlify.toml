[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/api/registros"
  to = "/.netlify/functions/records"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Página pública de política de privacidad (URL para Google Play).
[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 200

# Página pública de solicitud de eliminación de datos (URL para Google Play).
[[redirects]]
  from = "/eliminar-datos"
  to = "/eliminar-datos.html"
  status = 200
